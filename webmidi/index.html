<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Plus Bridge</title>
<style>
  /* The bridge on a phone without a computer: Python (Pyodide) runs bridge.py here, the pedal is on
     USB-OTG and reached through Web MIDI, the interface is ui.html as on the computer. */
  :root { color-scheme: dark; --panel: #151413; --ink: #f3f0e6; --muted: #b7b2a4; --accent: #ee7a24; --bad: #ff9a88; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink);
               font: 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 28px; background: var(--panel); min-height: 100%; }
  h1 { font-size: 17px; letter-spacing: .14em; text-transform: uppercase; margin: 4px 0 10px;
       padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  button { font: inherit; padding: 10px 16px; border-radius: 4px; border: 0; background: var(--accent); color: #1c0e03;
           font-weight: 700; min-height: 44px; }
  button:disabled { opacity: .4; }
  .hint { color: var(--muted); font-size: 13px; }
  #status { margin: 12px 0; color: var(--muted); white-space: pre-wrap; }
  #status.bad { color: var(--bad); }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<main id="launcher">
  <h1>MS Plus Bridge</h1>
  <div id="status">Loading …</div>
  <p class="hint">Back up your presets first (Zoom's own editor, or the installer of the bridge on a computer): the
    bridge changes them on the pedal when you tell it to.</p>
  <p><button id="start" disabled>Connect pedal and start</button></p>
</main>
<iframe id="ui" title="MS Plus Bridge" hidden></iframe>
<script type="module">
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.28.0/full/";
const ROOT = "/bridge", HOME = `${ROOT}/profiles/phone`;    // bridge.use_profile("phone"), kept in the browser
const SIMULATED = new URLSearchParams(location.search).has("sim");     // tests/sim.py through sim_server.py
const $ = (id) => document.getElementById(id);
let py = null, browser = null, syncing = Promise.resolve(), running = false;

const say = (text, bad = false) => { $("status").textContent = text; $("status").className = bad ? "bad" : ""; };

// --- The MIDI ports for mido_webmidi.py ---
window.webmidi = {
  access: null,
  queues: new Map(),         // input name → what it received since the bridge last looked
  ports() {
    const list = [];
    for (const [isInput, ports] of [[true, this.access.inputs], [false, this.access.outputs]]) {
      for (const port of ports.values()) if (port.state !== "disconnected") list.push([port.name, isInput]);
    }
    return list;
  },
  // shortcut: two devices of the same name are one port here; a second pedal needs a computer
  find(ports, name) {
    for (const port of ports.values()) if (port.name === name && port.state !== "disconnected") return port;
    throw new Error(`the MIDI port ${name} is gone`);
  },
  openInput(name) {
    const queue = [];
    this.queues.set(name, queue);
    this.find(this.access.inputs, name).onmidimessage = (event) => queue.push(Array.from(event.data));
  },
  take(name) {
    const queue = this.queues.get(name);
    if (!queue) throw new Error(`the MIDI port ${name} is not open`);
    return queue.splice(0);
  },
  closeInput(name) {
    this.queues.delete(name);
    try { this.find(this.access.inputs, name).onmidimessage = null; } catch { /* gone already */ }
  },
  openOutput(name) { this.find(this.access.outputs, name); },
  send(name, data) { this.find(this.access.outputs, name).send(data); },
};

// --- The interface: ui.html as it is, its requests answered by ui.answer instead of a server ---
window.bridgeFetch = async (request, init = {}) => {
  const url = new URL(request instanceof Request ? request.url : request, location.href);
  if (!url.pathname.startsWith("/api/")) return fetch(request, init);
  const body = typeof init.body === "string" ? init.body : "";
  const [status, data, type, filename, cache] = await browser.request.callPromising(
    init.method || "GET", url.pathname + url.search, body);
  const headers = {"Content-Type": type, "Cache-Control": cache};
  if (filename) headers["Content-Disposition"] = `attachment; filename="${filename}"`;
  return new Response(data, {status, headers});
};

function showInterface() {
  const page = py.FS.readFile(`${ROOT}/ui.html`, {encoding: "utf8"});
  $("ui").srcdoc = page.replace("<head>", "<head><script>window.fetch = (...request) => parent.bridgeFetch(...request); window.answeredByParent = true;<\/script>");
  $("ui").hidden = false;
  $("launcher").hidden = true;
}

// --- Settings and the pedal's device ID: kept in the browser's storage (IndexedDB) ---
function sync(populate = false) {
  syncing = syncing.then(() => new Promise((resolve) => py.FS.syncfs(populate, (error) => {
    if (error) console.warn("settings not stored", error);
    resolve();
  })));
  return syncing;
}

// Everything the bridge knows may go out without asking first (browser.allow_everything): its allowlist still
// lets only those messages through, with values within what was learned. A backup is asked for in the text.
async function ready() {
  browser.allow_everything();
  await sync();
  $("start").disabled = false;
  say(SIMULATED ? "Simulated pedal (tests/sim.py): nothing reaches a real one." : "Plug the pedal in (USB-OTG), then start.");
}

// --- Start ---
async function keepAwake() {
  try { await navigator.wakeLock?.request("screen"); } catch { /* not granted: the screen may go dark */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running) keepAwake();
  else if (py) sync();
});

$("start").addEventListener("click", async () => {
  $("start").disabled = true;
  try {
    say(SIMULATED ? "Connecting to the simulated pedal …" : "Asking for MIDI access …");
    if (!SIMULATED && !navigator.requestMIDIAccess) {
      throw new Error("This browser has no Web MIDI. On Android use Chrome; on an iPhone or iPad every browser is Safari underneath, which has none.");
    }
    webmidi.access = SIMULATED ? (await import("./sim_midi.js")).simulatedAccess()
                               : await navigator.requestMIDIAccess({sysex: true});
    say("Starting the bridge …");
    const problem = await browser.start.callPromising();
    await sync();
    if (problem) throw new Error(problem);
    running = true;
    keepAwake();
    setInterval(sync, 3000);
    showInterface();
    await browser.run.callPromising();      // for good, unless the bridge stops
    throw new Error("The bridge stopped.");
  } catch (error) {
    running = false;
    $("ui").hidden = true;
    $("launcher").hidden = false;
    say(String(error.message || error), true);
    $("start").disabled = false;
  }
});

(async () => {
  try {
    navigator.storage?.persist?.();          // the settings are not to be cleared when space runs short
    navigator.serviceWorker?.register("sw.js").catch((error) => console.warn("no offline copy", error));
    say("Loading Python (about 6 MB the first time) …");
    const {loadPyodide} = await import(PYODIDE + "pyodide.mjs");
    py = await loadPyodide({indexURL: PYODIDE});
    await py.loadPackage(["micropip", "pyyaml"]);
    await py.pyimport("micropip").install("mido==1.3.3");
    say("Loading the bridge …");
    const files = await (await fetch("files.json", {cache: "no-cache"})).json();
    py.FS.mkdirTree(HOME);
    await Promise.all([...files.map((name) => [`../${name}`, name]), ...["mido_webmidi.py", "browser.py"].map((name) => [name, name])]
      .map(async ([url, name]) => {
        const response = await fetch(url, {cache: "no-cache"});
        if (!response.ok) throw new Error(`${url} could not be loaded (${response.status})`);
        if (name.includes("/")) py.FS.mkdirTree(`${ROOT}/${name.slice(0, name.lastIndexOf("/"))}`);   // effect_icons/
        py.FS.writeFile(`${ROOT}/${name}`, new Uint8Array(await response.arrayBuffer()));
      }));
    py.FS.mount(py.FS.filesystems.IDBFS, {}, HOME);
    await sync(true);
    py.runPython(`import os, sys; sys.path.insert(0, "${ROOT}"); os.chdir("${ROOT}")`);
    browser = py.pyimport("browser");
    await ready();
  } catch (error) {
    say(`The bridge could not be loaded: ${error.message || error}`, true);
  }
})();
</script>
</body>
</html>
