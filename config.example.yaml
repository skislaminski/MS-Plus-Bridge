# MS Plus Bridge for the Zoom MS-60B+
# Copy this file to config.yaml and fill in the values (see README.md, "First-time setup").

ports:                            # the port's name or a unique part of it (`python probe.py ports`);
                                  # the interface sets them under "Devices"
  zoom: "ZOOM MS Plus Series"
  chocolate: ""                   # your MIDI controller, e.g. "SINCO" for the M-Vave Chocolate Plus

zoom:
  device_id: null                 # e.g. 0x6E, from `python probe.py identity`
  firmware: null

expression:                       # from `python probe.py cc`
  cc: null
  channel: null                   # 1–16
  min: 0
  max: 127
  invert: false

bridge:
  min_interval_ms: 10             # minimum time between two parameter messages
  deadband: 0                     # CC steps ignored as jitter
  passthrough: false              # pass the controller's program change and bank select (CC 0/32) through

ui:
  port: 8765                      # interface: http://127.0.0.1:8765
  listen: false                   # true: also for a phone or tablet in the same WLAN (everyone in it can use it)

synth:                            # optional: a MIDI keyboard plays a synth effect (README, "Keyboard synth")
  keyboard: ""                    # substring of the keyboard's port name; empty = none
  channel: 0                      # 1–16, or 0 for any channel
  external: ""                    # an external sequencer (an MPC): its notes play too, and its MIDI clock counts
  external_channel: 0             # the channel of its notes: 1–16, or 0 for any channel
  low_note: 0                     # notes outside low_note–high_note are ignored (the effects play 12–111)
  high_note: 127
  sustain: true                   # the sustain pedal (CC 64) holds notes
  bend_range: 2                   # semitones the pitch wheel bends each way, 0–12; 0 = wheel ignored

# Up to twelve parameters per preset, up to four per controller. This section is written by the
# interface and must stay at the end of the file. Key "bank/program", as the pedal reports the
# preset: bank = (display - 1) // 10, program = (display - 1) % 10 (measured on preset 095 = "9/4").
# slot = effect number - 1, param = parameter number + 1. min/max may narrow a learned range
# (measurements.json) but not leave it. invert: true = heel max, toe min.
# curve: linear, log (changes early) or exp (changes late).
mappings: {}
